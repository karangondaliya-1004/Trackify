[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "C90", "I"]
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.radon]
cc_min = "B"

[tool.pytest.ini_options]
pythonpath = ["."]
